spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

spring.application.name=audio
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.audio.transcription.base-url= https://api.openai.com
spring.ai.openai.audio.transcription.options.model = whisper-1
spring.ai.openai.audio.transcription.options.response-format = json



spring.datasource.url=jdbc:mysql://localhost:3306/audio_transcriber_db?useSSL=false&serverTimezone=UTC
spring.datasource.username = root
spring.datasource.password = admin@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.main.allow-bean-definition-overriding=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

server.port=8081


