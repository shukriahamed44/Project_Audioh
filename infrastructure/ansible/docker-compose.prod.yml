services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: admin@123
      MYSQL_DATABASE: audio_transcriber_db
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  frontend:
    image: shukriahamed44/project_audio_frontend:latest
    container_name: react-frontend
    ports:
      - "80:80"
    stdin_open: true
    tty: true
    depends_on:
      - backend
    networks:
      - app-network
    restart: always

  backend:
    image: shukriahamed44/project_audio_backend:latest
    container_name: spring-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/audio_transcriber_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_AUTOCONFIGURE_EXCLUDE : org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin@123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 5MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 5MB
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: always

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
